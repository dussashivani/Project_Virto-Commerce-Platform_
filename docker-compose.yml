# Virto Commerce - local deployment (Docker Compose)
# Scope: LOCAL DOCKER ONLY. This is not AWS and not Floci. See docs/ARCHITECTURE.md.
#
# Start:   ./scripts/up.sh          (or: docker compose up -d)
# Stop:    docker compose down      (data kept)   | ./scripts/cleanup.sh --volumes (data deleted)
# Verify:  ./scripts/validate.sh
name: virto

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer            # local/dev only - use RDS (licensed) in AWS
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?run scripts/generate-env.sh}
      TZ: ${TZ:-UTC}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [backend]               # no published ports: DB is reachable only from the compose network
    logging: *default-logging

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # LOCAL ONLY (network-isolated). Enable TLS+auth in production.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: ${TZ:-UTC}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [backend]
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?run scripts/generate-env.sh}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    logging: *default-logging

  platform:
    image: ${PLATFORM_IMAGE}
    restart: unless-stopped
    depends_on:
      sqlserver:      { condition: service_healthy }
      elasticsearch:  { condition: service_healthy }
      redis:          { condition: service_healthy }
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-UTC}
      # ASP.NET Core maps "__" to ":" so these override appsettings.json keys.
      ConnectionStrings__VirtoCommerce: "Data Source=sqlserver;Initial Catalog=${VC_DB_NAME};User ID=sa;Password=${MSSQL_SA_PASSWORD};MultipleActiveResultSets=True;TrustServerCertificate=True;Connect Timeout=30"
      ConnectionStrings__RedisConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      DatabaseProvider: SqlServer
      # LOCAL ONLY: the platform rejects HTTP token requests unless this is true. In AWS, TLS ends at the ALB.
      VirtoCommerce__AllowInsecureHttp: "true"
      Search__Provider: ${SEARCH_PROVIDER:-ElasticSearch8}
      Search__Scope: ${SEARCH_SCOPE:-default}
      Search__ElasticSearch8__Server: http://elasticsearch:9200
      Search__ElasticSearch8__EnableCompatibilityMode: "true"
    volumes:
      - platform_appdata:/opt/virtocommerce/platform/App_Data       # uploads, license, probing cache
      - platform_modules:/opt/virtocommerce/platform/modules        # installed modules (filled by scripts/install-modules.sh)
      - cms_content:/opt/virtocommerce/platform/wwwroot/cms-content # themes/pages shared with storefront
    ports:
      - "127.0.0.1:${PLATFORM_HOST_PORT:-8090}:80"
    healthcheck:
      # TCP probe (aspnet base images do not ship curl). HTTP-level checks run from scripts/validate.sh.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [backend, frontend]
    logging: *default-logging

  # One-shot job: installs the Virto module bundle into the platform_modules volume with the official
  # vc-build CLI. The platform image ships with ZERO modules (no admin UI) - see docs/STATUS.md.
  # Run via scripts/install-modules.sh (profile "init"), not started by a plain `up`.
  modules-init:
    image: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0}
    profiles: ["init"]
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      HOME: /tmp/home
      DOTNET_CLI_HOME: /tmp/home
      MODULES_BUNDLE_URL: ${MODULES_BUNDLE_URL}
    volumes:
      - platform_modules:/modules
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /tmp/home
        dotnet tool install --tool-path /tmp/tools VirtoCommerce.GlobalTool
        curl -fsSL "$$MODULES_BUNDLE_URL" -o /tmp/package.json
        /tmp/tools/vc-build install --package-manifest-path /tmp/package.json \
          --probing-path /tmp/probing --discovery-path /modules --root /tmp/root --skip-dependency-solving
        ls /modules | head -100
    networks: [backend]

  # Current official storefront: vc-frontend (Vue SPA, talks GraphQL to the platform). Static files served
  # by nginx, which also reverse-proxies /graphql, /connect/token, /files ... to the platform.
  # Artifact is downloaded by scripts/fetch-frontend.sh. Profile "storefront" = second start phase.
  frontend:
    image: ${FRONTEND_IMAGE:-nginx:1.30.7-alpine}
    restart: unless-stopped
    depends_on:
      platform: { condition: service_healthy }
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/artifact/default:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${STOREFRONT_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [frontend]              # only reaches the platform (via the shared frontend network)
    logging: *default-logging
    profiles: ["storefront"]

  # LEGACY storefront (kept as documented evidence): INCOMPATIBLE with platform 3.1076 - it calls
  # GET /api/stores which the platform answers with 405. See docs/STATUS.md and TROUBLESHOOTING.md.
  # Start only on purpose:  docker compose --profile legacy up -d storefront
  storefront:
    # Official image. NOTE: Docker Hub shows it as not updated for ~2 years (legacy ASP.NET storefront).
    image: ${STOREFRONT_IMAGE}
    restart: unless-stopped
    depends_on:
      platform: { condition: service_healthy }
    environment:
      ASPNETCORE_URLS: http://+:80
      TZ: ${TZ:-UTC}
      # Platform connection (appsettings keys VirtoCommerce:Endpoint:*)
      VirtoCommerce__Endpoint__Url: ${PLATFORM_INTERNAL_URL:-http://platform}
      VirtoCommerce__Endpoint__UserName: ${STOREFRONT_API_USER:-frontend}
      VirtoCommerce__Endpoint__Password: ${STOREFRONT_API_PASSWORD:-}   # validated by scripts/up.sh --with-storefront
    volumes:
      - cms_content:/opt/virtocommerce/storefront/wwwroot/cms-content:ro   # verified path in image (workdir /opt/virtocommerce/storefront)
    ports:
      - "127.0.0.1:${STOREFRONT_LEGACY_HOST_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [frontend]              # storefront cannot reach the database / search / redis directly
    logging: *default-logging
    profiles: ["legacy"]

volumes:
  mssql_data:
  es_data:
  redis_data:
  platform_appdata:
  platform_modules:
  cms_content:

networks:
  backend:
    internal: false   # platform needs outbound HTTPS for module downloads; DB/ES/Redis publish no ports
  frontend:
